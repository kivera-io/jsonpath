name: Security Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:

  SynkTests:
    name: Snyk Tests
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Run Snyk Test
        run: |
          snyk test --fail-on=upgradable
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}